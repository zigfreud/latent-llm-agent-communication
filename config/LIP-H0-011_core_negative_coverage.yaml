hypothesis:
  statement: "The remaining core-margin failure is partly caused by insufficient negative coverage during training: four-task batches expose only three alternatives while the gate exposes 31."
  intervention: "increase the unrolled training batch from 4 to 16 while holding architecture, loss, seed, and total examples seen constant"
  h0_010_reference: {batch_size: 4, updates: 512, examples_seen: 2048, in_batch_negatives: 3}
  h0_011_system: {batch_size: 16, updates: 128, examples_seen: 2048, in_batch_negatives: 15}
  known_limit: "batch size and optimizer-step count cannot both remain fixed at a fixed example budget; this screen identifies the practical intervention, not a pure asymptotic batch-size effect"

data:
  source: "LIP-PROTO-014_real_full_training_bundle"
  allowed_splits: ["train", "development_selection", "development_gate"]
  prohibited_splits: ["confirmation"]
  expected_counts: {train: 256, development_selection: 32, development_gate: 32}
