    4001: {core_margin: -0.054298, core_retrieval_top1: 0.46875, mean_retrieval: 0.59375}
    4003: {core_margin: -0.030750, core_retrieval_top1: 0.53125, mean_retrieval: 0.68750}
    4007: {core_margin: -0.004168, core_retrieval_top1: 0.56250, mean_retrieval: 0.65625}
  minimum_directional_replicas: 2
  minimum_strong_replicas: 2
  directional_criterion: "core margin improves, core retrieval is not lower, and mean retrieval is not lower relative to the paired H0-010 seed"
  strong_criterion: "the joint/core/name Holm family passes"
  pass_action: "freeze_a_new_untouched_functional_confirmation_design"
  directional_only_action: "retain_negative_coverage_and_test_explicit_core_margin_pressure"
  fail_action: "reject_negative_coverage_as_a_replicated_solution"

confirmation:
