    - ["text_only_no_lip", "neutral_no_lip"]
  primary_testing:
    method: "two_gate_then_holm"
    alternative: "greater"
    alpha: 0.05
    gates:
      - ["oracle_early_quarter_input_full_k32", "shuffled_oracle_early_quarter_input_full_k32"]
      - ["oracle_early_quarter_input_terminal_k24_mmm", "oracle_early_quarter_input_terminal_k24_sss"]
    family:
      - ["oracle_early_quarter_input_terminal_k24_mmm", "oracle_early_quarter_input_terminal_k24_smm"]
      - ["oracle_early_quarter_input_terminal_k24_mmm", "oracle_early_quarter_input_terminal_k24_msm"]
      - ["oracle_early_quarter_input_terminal_k24_mmm", "oracle_early_quarter_input_terminal_k24_mms"]
      - ["oracle_early_quarter_input_terminal_k24_mss", "oracle_early_quarter_input_terminal_k24_sss"]
      - ["oracle_early_quarter_input_terminal_k24_sms", "oracle_early_quarter_input_terminal_k24_sss"]
      - ["oracle_early_quarter_input_terminal_k24_ssm", "oracle_early_quarter_input_terminal_k24_sss"]
      - ["oracle_early_quarter_input_terminal_k24_smm", "oracle_early_quarter_input_terminal_k24_sss"]

