  system: "source packet -> frozen protocol code -> live-state-conditioned delta at each target layer -> frozen receiver block -> next live state"
  tested_property: "closed_loop_state_conditioning"
  excluded_explanations: ["static_absolute_snapshot", "static_affine_delta", "scalar_native_packet_blend", "single_layer_initial_condition_only"]

