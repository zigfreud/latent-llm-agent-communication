extraction:
  device: "auto"
  source_load_4bit: false
  target_load_4bit: true
  max_length: 512
  shard_size: 8
  self_check_tasks: 1
  maximum_self_logit_delta: 0.0001
  default_bundle_dir: "runs/LIP-PROTO-014/packet-bundle"

bridge:
  protocol_slots: 32
  bridge_width: 512
  attention_heads: 8
  feedforward_width: 2048
  encoder_blocks: 2
  decoder_blocks: 2
  dropout: 0.10

training:
  seeds: [4001, 4003, 4007]
  batch_size: 4
  max_updates: 2048
  validation_interval: 64
  learning_rate: 0.0002
  weight_decay: 0.01
  gradient_clip: 1.0
  fp16_autocast: true
  num_workers: 0
  default_output_dir: "runs/LIP-PROTO-014/training"

objectives:
  primary: "component_contrastive"
  variants:
    component_contrastive:
      role: "primary"
      model_kind: "query_conditioned"
      loss:
        temperature: 0.07
        margin_target: 0.05
        lambda_huber: 1.0
        lambda_cosine: 0.25
        lambda_symmetric_nce: 1.0
        lambda_margin: 0.10
        lambda_norm: 0.05
        component_weights: {core: 0.45, name: 0.45, boundary: 0.10}
    centered_regression:
      role: "objective_ablation"
      model_kind: "query_conditioned"
      loss:
        temperature: 0.07
        margin_target: 0.05
        lambda_huber: 1.0
        lambda_cosine: 0.25
        lambda_symmetric_nce: 0.0
        lambda_margin: 0.0
        lambda_norm: 0.0
        component_weights: {core: 0.45, name: 0.45, boundary: 0.10}
    structured_linear_regression:
      role: "architecture_baseline"
      model_kind: "structured_linear"
      loss:
        temperature: 0.07
        margin_target: 0.05
        lambda_huber: 1.0
        lambda_cosine: 0.25
        lambda_symmetric_nce: 0.0
        lambda_margin: 0.0
        lambda_norm: 0.0
        component_weights: {core: 0.45, name: 0.45, boundary: 0.10}

development_gate:
  alpha: 0.05
  statistics_seed: 4481
  minimum_passing_replicas: 2
  required_regions: [joint, core, name]

confirmation:
  task_count: 32
  source: "sealed_LIP-PROTO-013_capability_screen_remainder"
  predecessor_config: "config/LIP-PROTO-013_terminal_source_factorial.yaml"
  predecessor_selected_manifest: "datasets/LIP-PROTO-013/selected_task_manifest.json"
  candidate_tasks_jsonl: "datasets/LIP-PROTO-013/candidate_tasks.jsonl"
  screening_scored_jsonl: "runs/LIP-PROTO-013/screening/functional-evaluation/scored_generations.jsonl"
  tasks_jsonl: "datasets/LIP-PROTO-014/confirmation_tasks.jsonl"
  task_manifest: "datasets/LIP-PROTO-014/confirmation_task_manifest.json"
  selection_report: "runs/LIP-PROTO-014/confirmation-selection.json"
  tokenizer_strata: {2: 16, 3: 16}
  rank_slice_within_capable_stratum: [16, 32]
  generation_seeds: [4127, 4241, 4357]
  derangement_seed: 4513
  statistics_seed: 4481
  max_new_tokens: 256
  do_sample: true
  temperature: 0.2
  top_p: 0.95
  repetition_penalty: 1.0
  required_conditions:
    - "neutral_no_lip"
    - "text_only_no_lip"
    - "oracle_teacher_matched"
    - "oracle_teacher_shuffled"
    - "mean_scaffold"
    - "learned_matched"
    - "learned_shuffled"
    - "random_residual_norm_matched"

compute_policy:
  preferred_accelerator: "T4"
  sequential_model_extraction: true
  bridge_only_cached_training: true
  premium_gpu_for_speed_only: false
